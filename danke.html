<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke für deine Anmeldung</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #C2D0C5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #333;
      border-bottom: 1px solid #333;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Danke dir</h1>

    <p>
      Schön, dass du dabei bist.
    </p>

    <p>
     Du bist jetzt auf der Liste und erfährst als Erste*r, wann es losgeht.
    </p>

    <a href="index.html">Zurück</a>
  </div>

</body>
</html>
